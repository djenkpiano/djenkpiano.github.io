    <script>
      // Keep your own visits out of the stats: open the site once with ?me on
      // each of your devices (undo with ?notme). Umami skips every browser that
      // has `umami.disabled` set. The flag is stripped from the URL afterwards.
      try {
        var q = new URLSearchParams(location.search)
        if (q.has('me')) localStorage.setItem('umami.disabled', '1')
        if (q.has('notme')) localStorage.removeItem('umami.disabled')
        if (q.has('me') || q.has('notme')) {
          q.delete('me')
          q.delete('notme')
          var rest = q.toString()
          history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash)
        }
      } catch (e) {}
    </script>
